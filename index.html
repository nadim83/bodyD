<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Powerlifting Form & RPE Detector</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe Pose JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center p-6">

    <!-- Header & Controls -->
    <header class="text-center mb-4 max-w-2xl w-full">
        <h1 class="text-3xl font-bold text-cyan-400 mb-2">🏋️ AI Powerlifting & RPE Detector</h1>
        <p class="text-slate-400 text-sm mb-4">Select your exercise and camera mode below.</p>
        
        <!-- Controls Row -->
        <div class="flex flex-col sm:flex-row gap-3 items-center justify-between">
            <select id="exercise-type" class="w-full sm:flex-1 p-3 bg-slate-800 border border-slate-700 rounded-xl font-semibold text-cyan-300 focus:outline-none focus:border-cyan-400">
                <option value="squat">Squat Form & RPE</option>
                <option value="bench">Bench Press Form & RPE</option>
                <option value="deadlift">Deadlift Form & RPE</option>
            </select>

            <!-- Camera Switch Button -->
            <button id="toggle-camera" class="w-full sm:w-auto px-4 py-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl font-semibold text-cyan-400 transition">
                📷 Switch Camera (Back/Front)
            </button>

            <div id="rpe-badge" class="w-full sm:w-auto px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl font-bold text-amber-400 text-center min-w-[120px]">
                RPE: --
            </div>
        </div>
    </header>

    <!-- Main Video & Canvas Container -->
    <div class="relative w-full max-w-2xl bg-slate-800 rounded-2xl overflow-hidden border border-slate-700 shadow-2xl">
        <video id="webcam" class="hidden" autoplay playsinline></video>
        <canvas id="output_canvas" class="w-full h-auto block"></canvas>
    </div>

    <!-- Status / Real-time Feedback Box -->
    <div id="feedback-box" class="mt-6 p-4 w-full max-w-2xl bg-slate-800 border border-slate-700 rounded-xl text-center text-xl font-semibold text-cyan-300 shadow-lg transition-all duration-200">
        Initializing AI Camera & Velocity Tracker...
    </div>

    <!-- Footer -->
    <footer class="mt-8 text-slate-500 text-xs">
        Powered by MediaPipe Pose & Tailwind CSS
    </footer>

    <!-- App Logic Script -->
    <script type="module">
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const feedbackBox = document.getElementById('feedback-box');
        const exerciseSelect = document.getElementById('exercise-type');
        const rpeBadge = document.getElementById('rpe-badge');
        const toggleCameraBtn = document.getElementById('toggle-camera');

        let useFrontCamera = true; // ডিফল্ট ক্যামেরা স্টেট
        let currentStream = null;
        let lastY = 0;
        let lastTime = Date.now();
        let estimatedRPE = "--";

        function calculateAngle(a, b, c) {
            const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
            let angle = Math.abs(radians * 180.0 / Math.PI);
            if (angle > 180.0) {
                angle = 360 - angle;
            }
            return angle;
        }

        function onResults(results) {
            if (canvasElement.width !== videoElement.videoWidth || canvasElement.height !== videoElement.videoHeight) {
                canvasElement.width = videoElement.videoWidth || 640;
                canvasElement.height = videoElement.videoHeight || 480;
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            const selectedExercise = exerciseSelect.value;

            if (results.poseLandmarks) {
                const landmarks = results.poseLandmarks;

                const leftShoulder = landmarks[11];
                const leftHip = landmarks[23];
                const leftKnee = landmarks[25];
                const leftAnkle = landmarks[27];
                const leftElbow = landmarks[13];
                const leftWrist = landmarks[15];

                // Velocity & RPE Calculation
                const currentTime = Date.now();
                const timeDiff = (currentTime - lastTime) / 1000;
                
                let currentY = leftHip.y;
                if (selectedExercise === 'bench') currentY = leftWrist.y;

                if (timeDiff > 0.05) {
                    const speed = Math.abs(currentY - lastY) / timeDiff;
                    
                    if (speed > 0.4) {
                        estimatedRPE = "RPE 6 - 7 (Fast)";
                        rpeBadge.className = "px-4 py-3 bg-emerald-950 border border-emerald-500 rounded-xl font-bold text-emerald-400 text-center min-w-[120px]";
                    } else if (speed > 0.15 && speed <= 0.4) {
                        estimatedRPE = "RPE 8 - 8.5 (Moderate)";
                        rpeBadge.className = "px-4 py-3 bg-cyan-950 border border-cyan-500 rounded-xl font-bold text-cyan-400 text-center min-w-[120px]";
                    } else if (speed > 0.02 && speed <= 0.15) {
                        estimatedRPE = "RPE 9 - 9.5 (Heavy/Grind)";
                        rpeBadge.className = "px-4 py-3 bg-amber-950 border border-amber-500 rounded-xl font-bold text-amber-400 text-center min-w-[120px]";
                    } else if (speed <= 0.02 && speed > 0.001) {
                        estimatedRPE = "RPE 10 (Max Effort)";
                        rpeBadge.className = "px-4 py-3 bg-rose-950 border border-rose-500 rounded-xl font-bold text-rose-400 text-center min-w-[120px]";
                    }
                    
                    lastY = currentY;
                    lastTime = currentTime;
                }

                rpeBadge.innerText = estimatedRPE;

                if (selectedExercise === 'squat') {
                    drawJointLine(leftShoulder, leftHip, '#06b6d4');
                    drawJointLine(leftHip, leftKnee, '#3b82f6');
                    drawJointLine(leftKnee, leftAnkle, '#3b82f6');

                    const kneeAngle = calculateAngle(leftHip, leftKnee, leftAnkle);

                    if (kneeAngle > 150) {
                        feedbackBox.innerText = "Squat Ready. Chest up, brace core 🔽";
                        feedbackBox.className = "mt-6 p-4 w-full max-w-2xl bg-slate-800 border border-slate-700 rounded-xl text-center text-xl font-semibold text-cyan-300 shadow-lg";
                    } else if (kneeAngle >= 80 && kneeAngle <= 110) {
                        feedbackBox.innerText = "Parallel Depth Achieved! Drive up 🔥";
                        feedbackBox.className = "mt-6 p-4 w-full max-w-2xl bg-emerald-950/80 border border-emerald-500 rounded-xl text-center text-xl font-semibold text-emerald-400 shadow-lg";
                    } else {
                        feedbackBox.innerText = `Squatting... (Knee Angle: ${Math.round(kneeAngle)}°)`;
                        feedbackBox.className = "mt-6 p-4 w-full max-w-2xl bg-blue-950/80 border border-blue-500 rounded-xl text-center text-xl font-semibold text-blue-300 shadow-lg";
                    }

                } else if (selectedExercise === 'bench') {
                    drawJointLine(leftShoulder, leftElbow, '#06b6d4');
                    drawJointLine(leftElbow, leftWrist, '#3b82f6');

                    const elbowAngle = calculateAngle(leftShoulder, leftElbow, leftWrist);

                    if (elbowAngle > 160) {
                        feedbackBox.innerText = "Lockout. Unrack & control descent 🔽";
                        feedbackBox.className = "mt-6 p-4 w-full max-w-2xl bg-slate-800 border border-slate-700 rounded-xl text-center text-xl font-semibold text-cyan-300 shadow-lg";
                    } else if (elbowAngle >= 70 && elbowAngle <= 100) {
                        feedbackBox.innerText = "Good Touch Point & Flare! Press 🔥";
                        feedbackBox.className = "mt-6 p-4 w-full max-w-2xl bg-emerald-950/80 border border-emerald-500 rounded-xl text-center text-xl font-semibold text-emerald-400 shadow-lg";
                    } else {
                        feedbackBox.innerText = `Pressing... (Elbow Angle: ${Math.round(elbowAngle)}°)`;
                        feedbackBox.className = "mt-6 p-4 w-full max-w-2xl bg-blue-950/80 border border-blue-500 rounded-xl text-center text-xl font-semibold text-blue-300 shadow-lg";
                    }

                } else if (selectedExercise === 'deadlift') {
                    drawJointLine(leftShoulder, leftHip, '#06b6d4');
                    drawJointLine(leftHip, leftKnee, '#3b82f6');

                    const torsoLean = Math.abs(leftShoulder.x - leftHip.x);

                    if (torsoLean > 0.28) {
                        feedbackBox.innerText = "⚠️ WARNING: Spine rounding / back flexion detected!";
                        feedbackBox.className = "mt-6 p-4 w-full max-w-2xl bg-rose-950/80 border border-rose-500 rounded-xl text-center text-xl font-semibold text-rose-400 shadow-lg";
                    } else {
                        feedbackBox.innerText = "Deadlift Form Neutral. Pull through floor 🚀";
                        feedbackBox.className = "mt-6 p-4 w-full max-w-2xl bg-emerald-950/80 border border-emerald-500 rounded-xl text-center text-xl font-semibold text-emerald-400 shadow-lg";
                    }
                }

            } else {
                feedbackBox.innerText = "Step back! Full body not detected in camera frame ⚠️";
                feedbackBox.className = "mt-6 p-4 w-full max-w-2xl bg-amber-950/80 border border-amber-500 rounded-xl text-center text-xl font-semibold text-amber-400 shadow-lg";
                rpeBadge.innerText = "RPE: --";
            }
            canvasCtx.restore();
        }

        function drawJointLine(p1, p2, color) {
            if (!p1 || !p2) return;
            canvasCtx.beginPath();
            canvasCtx.moveTo(p1.x * canvasElement.width, p1.y * canvasElement.height);
            canvasCtx.lineTo(p2.x * canvasElement.width, p2.y * canvasElement.height);
            canvasCtx.lineWidth = 4;
            canvasCtx.strokeStyle = color;
            canvasCtx.stroke();
        }

        // Initialize MediaPipe Pose Model
        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            enableSegmentation: false,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        pose.onResults(onResults);

        // Custom Camera Stream Function with Back/Front Camera Switch Support
        async function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    facingMode: useFrontCamera ? "user" : "environment", // "environment" মানে পেছনের ক্যামেরা
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                }
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = currentStream;
                await videoElement.play();

                // Frame processing loop
                async function processVideoFrame() {
                    if (!videoElement.paused && !videoElement.ended) {
                        await pose.send({ image: videoElement });
                        requestAnimationFrame(processVideoFrame);
                    }
                }
                processVideoFrame();

            } catch (err) {
                console.error("Camera access error:", err);
                feedbackBox.innerText = "Camera access denied or unavailable. Please allow permissions.";
                feedbackBox.className = "mt-6 p-4 w-full max-w-2xl bg-rose-950/80 border border-rose-500 rounded-xl text-center text-xl font-semibold text-rose-400 shadow-lg";
            }
        }

        // Switch Camera Button Event
        toggleCameraBtn.addEventListener('click', () => {
            useFrontCamera = !useFrontCamera;
            startCamera();
        });

        // Initial Start
        startCamera();
    </script>
</body>
</html>
