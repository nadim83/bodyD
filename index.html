<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Powerlifting Form & FMS Scanner</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe Pose JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center p-4">

    <!-- Header & Controls -->
    <header class="text-center mb-4 max-w-xl w-full">
        <h1 class="text-2xl font-bold text-cyan-400 mb-1">🛡️ AI Form & FMS Screening Pro</h1>
        <p class="text-slate-400 text-xs mb-3">Instant Form Correction & Functional Movement Screening.</p>
        
        <!-- Controls Row -->
        <div class="flex flex-col gap-2">
            <select id="analysis-mode" class="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-xl font-semibold text-cyan-300 text-sm focus:outline-none focus:border-cyan-400">
                <option value="fms">FMS টেস্ট ও মুভমেন্ট স্ক্রীনিং (Functional Movement Screen)</option>
                <option value="squat_form">স্কোয়াট ফর্ম ও পসচার চেক (Squat Form Check)</option>
                <option value="upper_form">আপার বডি ফর্ম ও অ্যাসিমেট্রি (Upper Body Posture)</option>
            </select>

            <button id="toggle-camera" class="w-full py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl font-semibold text-cyan-400 text-sm transition">
                📷 ক্যামেরা পরিবর্তন (Front/Back)
            </button>
        </div>

        <!-- Live Control Button -->
        <div class="mt-3">
            <button id="live-toggle-btn" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold text-white shadow-lg transition flex items-center justify-center gap-2 text-sm">
                🟢 স্ক্যানিং শুরু করুন
            </button>
        </div>
    </header>

    <!-- Main Video & Canvas Container -->
    <div class="relative w-full max-w-xl bg-slate-800 rounded-2xl overflow-hidden border border-slate-700 shadow-xl flex justify-center items-center min-h-[300px]">
        <video id="webcam" class="w-full h-auto block" autoplay playsinline muted></video>
        <canvas id="output_canvas" class="absolute inset-0 w-full h-full pointer-events-none z-10"></canvas>
    </div>

    <!-- Live Status Box -->
    <div id="feedback-box" class="mt-3 p-3 w-full max-w-xl bg-slate-800 border border-slate-700 rounded-xl text-center text-sm font-semibold text-cyan-300 shadow-lg">
        ক্যামেরা অন করে "স্ক্যানিং শুরু করুন" বাটনে চাপ দিন... ⏳
    </div>

    <!-- Summary Report Section -->
    <div class="mt-4 w-full max-w-xl bg-slate-800/90 border border-cyan-500/40 rounded-2xl p-4 shadow-xl">
        <div class="flex justify-between items-center mb-2 border-b border-slate-700 pb-2">
            <h2 class="text-base font-bold text-cyan-400">📋 লাইভ স্ক্যান ও ডায়াগনস্টিক রিপোর্ট</h2>
            <button id="reset-log" class="text-xs bg-slate-700 hover:bg-slate-600 px-2.5 py-1 rounded-lg text-slate-300 transition">রিসেট</button>
        </div>
        <div id="log-content" class="space-y-1 text-slate-300 text-xs">
            <p class="text-slate-500 italic">এখনো কোনো স্ক্যান করা হয়নি।</p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-6 text-slate-500 text-[10px]">
        AI Biomechanics & FMS Engine
    </footer>

    <!-- App Logic Script -->
    <script type="module">
        const webcamElement = document.getElementById('webcam');
        const liveToggleBtn = document.getElementById('live-toggle-btn');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const feedbackBox = document.getElementById('feedback-box');
        const modeSelect = document.getElementById('analysis-mode');
        const toggleCameraBtn = document.getElementById('toggle-camera');
        const logContent = document.getElementById('log-content');
        const resetLogBtn = document.getElementById('reset-log');

        let useFrontCamera = false;
        let currentStream = null;
        let isScanning = false;
        let detectedIssues = [];
        let scanFramesCount = 0;
        let isSending = false;

        function calculateAngle(a, b, c) {
            const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
            let angle = Math.abs(radians * 180.0 / Math.PI);
            if (angle > 180.0) angle = 360 - angle;
            return angle;
        }

        function onResults(results) {
            if (!isScanning) return;
            if (!results.image) return;

            if (canvasElement.width !== webcamElement.videoWidth || canvasElement.height !== webcamElement.videoHeight) {
                canvasElement.width = webcamElement.videoWidth || 640;
                canvasElement.height = webcamElement.videoHeight || 480;
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            const currentMode = modeSelect.value;

            if (results.poseLandmarks) {
                const landmarks = results.poseLandmarks;
                const leftShoulder = landmarks[11];
                const rightShoulder = landmarks[12];
                const leftHip = landmarks[23];
                const rightHip = landmarks[24];
                const leftKnee = landmarks[25];
                const rightKnee = landmarks[26];
                const leftAnkle = landmarks[27];

                scanFramesCount++;

                if (currentMode === 'fms') {
                    // FMS Mobility & Symmetry Check
                    const shoulderDiff = Math.abs(leftShoulder.y - rightShoulder.y);
                    if (shoulderDiff > 0.03) {
                        addUniqueIssue("⚠️ কাঁধের ভারসাম্যহীনতা (Shoulder Asymmetry detected)");
                        drawJointLine(leftShoulder, rightShoulder, '#f43f5e');
                    } else {
                        drawJointLine(leftShoulder, rightShoulder, '#10b981');
                    }

                    const hipDiff = Math.abs(leftHip.y - rightHip.y);
                    if (hipDiff > 0.03) {
                        addUniqueIssue("⚠️ পেলভিক টিল্ট / হিপ ভারসাম্যহীনতা");
                        drawJointLine(leftHip, rightHip, '#f43f5e');
                    } else {
                        drawJointLine(leftHip, rightHip, '#10b981');
                    }

                    feedbackBox.innerText = `FMS স্ক্যান চলছে... (${Math.min(100, Math.round((scanFramesCount/150)*100))}%)`;
                    feedbackBox.className = "mt-3 p-3 w-full max-w-xl bg-cyan-950/80 border border-cyan-500 rounded-xl text-center text-sm font-semibold text-cyan-300 shadow-lg";

                    if (scanFramesCount > 150) {
                        finalizeScan("FMS স্ক্রীনিং রিপোর্ট");
                    }

                } else if (currentMode === 'squat_form') {
                    drawJointLine(leftShoulder, leftHip, '#06b6d4');
                    drawJointLine(leftHip, leftKnee, '#3b82f6');
                    drawJointLine(leftKnee, leftAnkle, '#3b82f6');

                    const kneeAngle = calculateAngle(leftHip, leftKnee, leftAnkle);

                    if (kneeAngle < 110) {
                        addUniqueIssue("✓ গভীর স্কোয়াট ডেপথ অর্জিত হয়েছে");
                    } else if (kneeAngle > 140 && scanFramesCount > 50) {
                        addUniqueIssue("⚠️ স্কোয়াট ডেপথ পর্যাপ্ত নয় (Parallel এর উপরে)");
                    }

                    feedbackBox.innerText = `স্কোয়াট ফর্ম স্ক্যান হচ্ছে... হাঁটু এঙ্গেল: ${Math.round(kneeAngle)}°`;
                    feedbackBox.className = "mt-3 p-3 w-full max-w-xl bg-slate-800 border border-slate-700 rounded-xl text-center text-sm font-semibold text-cyan-300 shadow-lg";

                    if (scanFramesCount > 180) {
                        finalizeScan("স্কোয়াট ফর্ম স্ক্যান রিপোর্ট");
                    }

                } else if (currentMode === 'upper_form') {
                    drawJointLine(leftShoulder, rightShoulder, '#06b6d4');
                    
                    const spineLean = Math.abs(leftShoulder.x - leftHip.x);
                    if (spineLean > 0.15) {
                        addUniqueIssue("⚠️ উচ্চতা বা স্পাইনে অতিরিক্ত ল্যাটারাল ফ্লেকশন");
                    } else {
                        addUniqueIssue("✓ আপার বডি অ্যালাইনমেন্ট সঠিক রয়েছে");
                    }

                    feedbackBox.innerText = `আপার বডি স্ক্যান চলছে...`;
                    feedbackBox.className = "mt-3 p-3 w-full max-w-xl bg-slate-800 border border-slate-700 rounded-xl text-center text-sm font-semibold text-cyan-300 shadow-lg";

                    if (scanFramesCount > 150) {
                        finalizeScan("আপার বডি পোস্টার রিপোর্ট");
                    }
                }
            }
            canvasCtx.restore();
        }

        function addUniqueIssue(issue) {
            if (!detectedIssues.includes(issue)) {
                detectedIssues.push(issue);
            }
        }

        function finalizeScan(modeName) {
            isScanning = false;
            liveToggleBtn.innerHTML = "🟢 স্ক্যানিং শুরু করুন";
            liveToggleBtn.className = "w-full py-3 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold text-white shadow-lg transition flex items-center justify-center gap-2 text-sm";

            let uniqueIssues = [...new Set(detectedIssues)];
            let problemsHTML = uniqueIssues.length === 0 
                ? `<span class="text-emerald-400 font-semibold">✨ কোনো ত্রুটি পাওয়া যায়নি! পারফেক্ট।</span>`
                : `<ul class="space-y-1">` + uniqueIssues.map(err => `<li class="text-xs ${err.startsWith('✓') ? 'text-emerald-400' : 'text-rose-400'}">${err}</li>`).join('') + `</ul>`;

            const timestamp = new Date().toLocaleTimeString();
            
            logContent.innerHTML = `
                <div class="bg-slate-900 p-3 rounded-xl border border-slate-700 shadow-inner">
                    <div class="flex justify-between font-bold text-cyan-300 text-xs mb-1">
                        <span>${modeName}</span>
                        <span class="text-emerald-400">সম্পন্ন</span>
                    </div>
                    <div class="text-[10px] text-slate-400 mb-2">সময়: ${timestamp}</div>
                    <div class="bg-slate-800 p-2 rounded-lg border border-slate-700">
                        <div class="font-semibold text-cyan-400 mb-1 text-[11px]">পর্যবেক্ষণ ও ফলাফল:</div>
                        ${problemsHTML}
                    </div>
                </div>
            `;
            
            feedbackBox.innerText = "স্ক্যান সম্পন্ন! নিচের রিপোর্টে ফলাফল দেখুন 🎯";
            feedbackBox.className = "mt-3 p-3 w-full max-w-xl bg-emerald-950/80 border border-emerald-500 rounded-xl text-center text-sm font-semibold text-emerald-300 shadow-lg";
        }

        function drawJointLine(p1, p2, color) {
            if (!p1 || !p2) return;
            canvasCtx.beginPath();
            canvasCtx.moveTo(p1.x * canvasElement.width, p1.y * canvasElement.height);
            canvasCtx.lineTo(p2.x * canvasElement.width, p2.y * canvasElement.height);
            canvasCtx.lineWidth = 3;
            canvasCtx.strokeStyle = color;
            canvasCtx.stroke();
        }

        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            enableSegmentation: false,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        pose.onResults(onResults);

        async function runAnalyzerLoop() {
            if (!isScanning) return;

            if (!webcamElement.paused && !webcamElement.ended) {
                if (!isSending && webcamElement.readyState >= 2) {
                    isSending = true;
                    try {
                        await pose.send({ image: webcamElement });
                    } catch (err) {
                        console.error("Pose error:", err);
                    }
                    isSending = false;
                }
                requestAnimationFrame(runAnalyzerLoop);
            }
        }

        async function startCamera() {
            if (currentStream) currentStream.getTracks().forEach(track => track.stop());

            let constraints = {
                video: {
                    facingMode: useFrontCamera ? "user" : "environment",
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                }
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
            } catch (err) {
                try {
                    currentStream = await navigator.mediaDevices.getUserMedia({ video: true });
                } catch (e) {
                    feedbackBox.innerText = "ক্যামেরা অ্যাক্সেস পাওয়া যায়নি।";
                    return;
                }
            }

            webcamElement.srcObject = currentStream;
            webcamElement.onloadedmetadata = () => {
                webcamElement.play();
            };
        }

        liveToggleBtn.addEventListener('click', () => {
            isScanning = !isScanning;
            if (isScanning) {
                scanFramesCount = 0;
                detectedIssues = [];
                liveToggleBtn.innerHTML = "🛑 স্ক্যান বন্ধ করুন";
                liveToggleBtn.className = "w-full py-3 bg-rose-600 hover:bg-rose-500 rounded-xl font-bold text-white shadow-lg transition flex items-center justify-center gap-2 text-sm";
                runAnalyzerLoop();
            } else {
                finalizeScan("ম্যানুয়াল স্টপ");
            }
        });

        toggleCameraBtn.onclick = () => {
            useFrontCamera = !useFrontCamera;
            startCamera();
        };

        resetLogBtn.addEventListener('click', () => {
            logContent.innerHTML = `<p class="text-slate-500 italic">এখনো কোনো স্ক্যান করা হয়নি।</p>`;
            detectedIssues = [];
            scanFramesCount = 0;
            isScanning = false;
            liveToggleBtn.innerHTML = "🟢 স্ক্যানিং শুরু করুন";
            liveToggleBtn.className = "w-full py-3 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold text-white shadow-lg transition flex items-center justify-center gap-2 text-sm";
            feedbackBox.innerText = "রিসেট করা হয়েছে। স্ক্যান শুরু করতে বাটনে চাপ দিন।";
        });

        modeSelect.addEventListener('change', () => {
            detectedIssues = [];
            scanFramesCount = 0;
            isScanning = false;
            liveToggleBtn.innerHTML = "🟢 স্ক্যানিং শুরু করুন";
            liveToggleBtn.className = "w-full py-3 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold text-white shadow-lg transition flex items-center justify-center gap-2 text-sm";
        });

        startCamera();
    </script>
</body>
</html>
