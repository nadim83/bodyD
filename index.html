<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Powerlifting & Posture Scanner with Auto RPE</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe Pose JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center p-6">

    <!-- Header & Controls -->
    <header class="text-center mb-4 max-w-2xl w-full">
        <h1 class="text-3xl font-bold text-cyan-400 mb-2">🧬 Biomechanical Lift & Posture Analyzer</h1>
        <p class="text-slate-400 text-sm mb-4">Live & Video Upload Analysis with Form Tracking & Estimated RPE.</p>
        
        <!-- Controls Row -->
        <div class="flex flex-col sm:flex-row gap-3 items-center justify-between">
            <select id="analysis-mode" class="w-full sm:flex-1 p-3 bg-slate-800 border border-slate-700 rounded-xl font-semibold text-cyan-300 focus:outline-none focus:border-cyan-400">
                <option value="posture">পূর্ণাঙ্গ শারীরিক ভঙ্গি স্ক্যান (Posture & Symmetry)</option>
                <option value="squat">স্কোয়াট ফর্ম ও RPE এনালাইসিস</option>
                <option value="bench">বেঞ্চ প্রেস ফর্ম ও RPE এনালাইসিস</option>
                <option value="deadlift">ডেডলিফ্ট ফর্ম ও RPE এনালাইসিস</option>
            </select>

            <!-- Camera Switch Button -->
            <button id="toggle-camera" class="w-full sm:w-auto px-4 py-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl font-semibold text-cyan-400 transition">
                📷 ক্যামেরা পরিবর্তন
            </button>
        </div>

        <!-- Video Upload Section -->
        <div class="mt-4 p-4 bg-slate-800 border border-dashed border-slate-600 rounded-xl text-center">
            <label class="block text-sm font-medium text-slate-300 mb-2">📁 লিফটের ভিডিও আপলোড করুন (স্কোয়াট/বেঞ্চ/ডেডলিফ্ট)</label>
            <input type="file" id="video-upload" accept="video/*" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-cyan-600 file:text-white hover:file:bg-cyan-500 cursor-pointer">
        </div>
    </header>

    <!-- Main Video/Upload & Canvas Container -->
    <div class="relative w-full max-w-2xl bg-slate-800 rounded-2xl overflow-hidden border border-slate-700 shadow-2xl flex justify-center items-center min-h-[360px]">
        <video id="webcam" class="hidden" autoplay playsinline muted></video>
        <video id="uploaded-video" class="w-full h-auto block" controls playsinline muted></video>
        <canvas id="output_canvas" class="absolute inset-0 w-full h-full pointer-events-none"></canvas>
    </div>

    <!-- Live Status Box -->
    <div id="feedback-box" class="mt-4 p-4 w-full max-w-2xl bg-slate-800 border border-slate-700 rounded-xl text-center text-lg font-semibold text-cyan-300 shadow-lg">
        ক্যামেরার সামনে বা ভিডিও আপলোড করে লিফট শুরু করুন... ⏳
    </div>

    <!-- Posture & Diagnostics Summary Section -->
    <div class="mt-6 w-full max-w-2xl bg-slate-800/90 border border-cyan-500/40 rounded-2xl p-5 shadow-2xl">
        <div class="flex justify-between items-center mb-3 border-b border-slate-700 pb-2">
            <h2 class="text-xl font-bold text-cyan-400">📋 ফর্ম ও RPE ডায়াগনস্টিক রিপোর্ট</h2>
            <button id="reset-log" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-slate-300 transition">লগ মুছুন</button>
        </div>
        <div id="log-content" class="space-y-2 text-slate-300 text-sm">
            <p class="text-slate-500 italic">এখনো কোনো লিফটের ডেটা রেকর্ড করা হয়নি।</p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-8 text-slate-500 text-xs">
        Powered by Biomechanics & Bar Velocity RPE Estimation
    </footer>

    <!-- App Logic Script -->
    <script type="module">
        const webcamElement = document.getElementById('webcam');
        const uploadedVideoElement = document.getElementById('uploaded-video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const feedbackBox = document.getElementById('feedback-box');
        const modeSelect = document.getElementById('analysis-mode');
        const toggleCameraBtn = document.getElementById('toggle-camera');
        const videoUploadInput = document.getElementById('video-upload');
        const logContent = document.getElementById('log-content');
        const resetLogBtn = document.getElementById('reset-log');

        let useFrontCamera = false;
        let currentStream = null;
        let activeSource = webcamElement;

        let scanFramesCount = 0;
        let detectedIssues = [];
        let isSending = false;
        let scanCompleted = false;

        // RPE tracking variables
        let repSpeeds = [];
        let lastHipY = 0;
        let lastWristY = 0;
        let movementDirection = 'down';
        let repCount = 0;

        function calculateAngle(a, b, c) {
            const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
            let angle = Math.abs(radians * 180.0 / Math.PI);
            if (angle > 180.0) angle = 360 - angle;
            return angle;
        }

        function onResults(results) {
            if (!results.image) return;

            if (canvasElement.width !== activeSource.videoWidth || canvasElement.height !== activeSource.videoHeight) {
                canvasElement.width = activeSource.videoWidth || 640;
                canvasElement.height = activeSource.videoHeight || 480;
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            if (activeSource === webcamElement) {
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            }

            const currentMode = modeSelect.value;

            if (results.poseLandmarks) {
                const landmarks = results.poseLandmarks;
                
                const nose = landmarks[0];
                const leftShoulder = landmarks[11];
                const rightShoulder = landmarks[12];
                const leftHip = landmarks[23];
                const rightHip = landmarks[24];
                const leftKnee = landmarks[25];
                const rightKnee = landmarks[26];
                const leftAnkle = landmarks[27];
                const rightAnkle = landmarks[28];
                const leftWrist = landmarks[15];
                const rightWrist = landmarks[16];
                const leftElbow = landmarks[13];

                scanFramesCount++;

                if (currentMode === 'posture') {
                    const shoulderDiff = Math.abs(leftShoulder.y - rightShoulder.y);
                    if (shoulderDiff > 0.045) {
                        const side = leftShoulder.y < rightShoulder.y ? "বাম কাঁধ উঁচুতে রয়েছে" : "ডান কাঁধ উঁচুতে রয়েছে";
                        addUniqueIssue(`⚠️ অসামঞ্জস্যতা: ${side}`);
                        drawJointLine(leftShoulder, rightShoulder, '#f43f5e');
                    } else {
                        drawJointLine(leftShoulder, rightShoulder, '#10b981');
                    }

                    const hipDiff = Math.abs(leftHip.y - rightHip.y);
                    if (hipDiff > 0.04) {
                        addUniqueIssue("⚠️ কোমরের ভারসাম্যহীনতা বা পেলভিক টিল্ট শনাক্ত হয়েছে");
                        drawJointLine(leftHip, rightHip, '#f43f5e');
                    } else {
                        drawJointLine(leftHip, rightHip, '#10b981');
                    }

                    feedbackBox.innerText = `ভঙ্গি স্ক্যান চলছে (${Math.min(100, Math.round((scanFramesCount/200)*100))}%)...`;
                    feedbackBox.className = "mt-4 p-4 w-full max-w-2xl bg-cyan-950/80 border border-cyan-500 rounded-xl text-center text-lg font-semibold text-cyan-300 shadow-lg";

                    if (scanFramesCount > 200 && !scanCompleted) {
                        finalizeLog("পূর্ণাঙ্গ শারীরিক ভঙ্গি মূল্যায়ন");
                        scanCompleted = true;
                    }

                } else if (currentMode === 'squat') {
                    drawJointLine(leftShoulder, leftHip, '#06b6d4');
                    drawJointLine(leftHip, leftKnee, '#3b82f6');
                    drawJointLine(leftKnee, leftAnkle, '#3b82f6');
                    
                    const kneeAngle = calculateAngle(leftHip, leftKnee, leftAnkle);
                    
                    // Track rep speed for RPE calculation based on hip Y movement
                    let speed = Math.abs(leftHip.y - lastHipY);
                    lastHipY = leftHip.y;
                    repSpeeds.push(speed);

                    let estimatedRPE = estimateRPE(repSpeeds);

                    if (kneeAngle < 85) {
                        addUniqueIssue("✓ সঠিক স্কোয়াট ডেপথ বা গভীরতা অর্জিত হয়েছে");
                    } else if (kneeAngle > 110) {
                        addUniqueIssue("⚠️ স্কোয়াটের গভীরতা কম হয়েছে (উঁচু স্কোয়াট)");
                    }

                    feedbackBox.innerText = `🏋️ স্কোয়াট মোড | হাঁটু কোণ: ${Math.round(kneeAngle)}° | আনুমানিক RPE: ${estimatedRPE}`;
                    feedbackBox.className = "mt-4 p-4 w-full max-w-2xl bg-slate-800 border border-slate-700 rounded-xl text-center text-lg font-semibold text-cyan-300 shadow-lg";

                } else if (currentMode === 'bench') {
                    drawJointLine(leftShoulder, leftElbow, '#06b6d4');
                    drawJointLine(leftElbow, leftWrist, '#3b82f6');
                    
                    const elbowAngle = calculateAngle(leftShoulder, leftElbow, leftWrist);
                    
                    let speed = Math.abs(leftWrist.y - lastWristY);
                    lastWristY = leftWrist.y;
                    repSpeeds.push(speed);

                    let estimatedRPE = estimateRPE(repSpeeds);

                    if (elbowAngle < 75) {
                        addUniqueIssue("✓ বুকে সঠিকভাবে বার স্পর্শ করেছে");
                    }

                    feedbackBox.innerText = `🦾 বেঞ্চ প্রেস মোড | কনুই কোণ: ${Math.round(elbowAngle)}° | আনুমানিক RPE: ${estimatedRPE}`;
                    feedbackBox.className = "mt-4 p-4 w-full max-w-2xl bg-slate-800 border border-slate-700 rounded-xl text-center text-lg font-semibold text-cyan-300 shadow-lg";

                } else if (currentMode === 'deadlift') {
                    drawJointLine(leftShoulder, leftHip, '#06b6d4');
                    drawJointLine(leftHip, leftKnee, '#3b82f6');
                    
                    let speed = Math.abs(leftHip.y - lastHipY);
                    lastHipY = leftHip.y;
                    repSpeeds.push(speed);

                    let estimatedRPE = estimateRPE(repSpeeds);
                    const spineLean = Math.abs(leftShoulder.x - leftHip.x);

                    if (spineLean > 0.35) {
                        addUniqueIssue("⚠️ নিচের পিঠ বা মেরুদণ্ড বাঁকা হয়ে যাচ্ছে (ঝুঁকিপূর্ণ)");
                    } else {
                        addUniqueIssue("✓ মেরুদণ্ড স্বাভাবিক বা নিউট্রাল রয়েছে");
                    }

                    feedbackBox.innerText = `⚡ ডেডলিফ্ট মোড | স্পাইন ট্র্যাকিং সচল | আনুমানিক RPE: ${estimatedRPE}`;
                    feedbackBox.className = "mt-4 p-4 w-full max-w-2xl bg-slate-800 border border-slate-700 rounded-xl text-center text-lg font-semibold text-cyan-300 shadow-lg";
                }
            }
            canvasCtx.restore();
        }

        function estimateRPE(speeds) {
            if (speeds.length < 10) return "8.0 (শুরু হচ্ছে)";
            // Average the last few frames to gauge movement velocity drop (Grind factor)
            const recentSpeeds = speeds.slice(-15);
            const avgSpeed = recentSpeeds.reduce((a, b) => a + b, 0) / recentSpeeds.length;
            
            // Lower speed/stalling during lift indicates higher RPE (closer to failure)
            if (avgSpeed < 0.002) return "9.5 - 10 (অতিরিক্ত কষ্ট/Grind)";
            if (avgSpeed < 0.005) return "8.5 - 9.0 (ভারী এফোর্ট)";
            if (avgSpeed < 0.010) return "7.5 - 8.0 (দৃঢ় গতি)";
            return "6.5 - 7.0 (সহজ ও সাবলীল)";
        }

        function addUniqueIssue(issue) {
            if (!detectedIssues.includes(issue)) {
                detectedIssues.push(issue);
            }
        }

        function finalizeLog(modeName) {
            let uniqueIssues = [...new Set(detectedIssues)];
            let problemsHTML = "";
            
            if (uniqueIssues.length === 0) {
                problemsHTML = `<span class="text-emerald-400 font-semibold text-base">✨ চমৎকার ফর্ম! বড় কোনো ভুল পাওয়া যায়নি।</span>`;
            } else {
                problemsHTML = `<ul class="space-y-1">` + uniqueIssues.map(err => {
                    let colorClass = err.startsWith('✓') ? 'text-emerald-400' : 'text-rose-400';
                    return `<li class="${colorClass} text-sm">${err}</li>`;
                }).join('') + `</ul>`;
            }

            const timestamp = new Date().toLocaleTimeString();
            
            logContent.innerHTML = `
                <div class="bg-slate-900/90 p-4 rounded-xl border border-slate-700 mb-2 shadow-inner">
                    <div class="flex justify-between font-bold text-cyan-300 text-base mb-1">
                        <span>বিশ্লেষণের ধরন: ${modeName}</span>
                        <span class="text-emerald-400">সম্পন্ন</span>
                    </div>
                    <div class="text-xs text-slate-400 mb-3">সময়: ${timestamp}</div>
                    <div class="bg-slate-800/80 p-3 rounded-lg border border-slate-700">${problemsHTML}</div>
                </div>
            `;
            
            feedbackBox.innerText = "বিশ্লেষণ সম্পন্ন হয়েছে! নিচের লগ দেখুন 🎯";
            feedbackBox.className = "mt-4 p-4 w-full max-w-2xl bg-emerald-950/80 border border-emerald-500 rounded-xl text-center text-lg font-semibold text-emerald-300 shadow-lg";
        }

        function drawJointLine(p1, p2, color) {
            if (!p1 || !p2) return;
            canvasCtx.beginPath();
            canvasCtx.moveTo(p1.x * canvasElement.width, p1.y * canvasElement.height);
            canvasCtx.lineTo(p2.x * canvasElement.width, p2.y * canvasElement.height);
            canvasCtx.lineWidth = 4;
            canvasCtx.strokeStyle = color;
            canvasCtx.stroke();
        }

        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            enableSegmentation: false,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        pose.onResults(onResults);

        async function runAnalyzerLoop() {
            if (!activeSource.paused && !activeSource.ended) {
                if (!isSending && activeSource.readyState >= 2) {
                    isSending = true;
                    try {
                        await pose.send({ image: activeSource });
                    } catch (err) {
                        console.error("Pose send error:", err);
                    }
                    isSending = false;
                }
                requestAnimationFrame(runAnalyzerLoop);
            }
        }

        async function startCamera() {
            if (currentStream) currentStream.getTracks().forEach(track => track.stop());
            uploadedVideoElement.classList.add('hidden');
            webcamElement.classList.remove('hidden');
            
            activeSource = webcamElement;
            scanFramesCount = 0;
            detectedIssues = [];
            repSpeeds = [];
            scanCompleted = false;

            let constraints = {
                video: {
                    facingMode: useFrontCamera ? "user" : "environment",
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                }
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
            } catch (err) {
                try {
                    constraints = { video: { width: { ideal: 640 }, height: { ideal: 480 } } };
                    currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (e) {
                    feedbackBox.innerText = "ক্যামেরা অ্যাক্সেস পাওয়া যায়নি।";
                    return;
                }
            }

            webcamElement.srcObject = currentStream;
            webcamElement.onloadedmetadata = () => {
                webcamElement.play().then(() => {
                    runAnalyzerLoop();
                });
            };
        }

        videoUploadInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const videoUrl = URL.createObjectURL(file);
            
            webcamElement.classList.add('hidden');
            uploadedVideoElement.classList.remove('hidden');

            uploadedVideoElement.src = videoUrl;
            uploadedVideoElement.load();
            
            activeSource = uploadedVideoElement;
            scanFramesCount = 0;
            detectedIssues = [];
            repSpeeds = [];
            scanCompleted = false;

            uploadedVideoElement.play().then(() => {
                runAnalyzerLoop();
            }).catch(e => {
                console.error("Autoplay prevented:", e);
                feedbackBox.innerText = "ভিডিও চালু করতে প্লে বাটনে ক্লিক করুন ⚠️";
            });
            
            feedbackBox.innerText = "ভিডিওর লিফট ও RPE বিশ্লেষণ করা হচ্ছে... 🎬";
            feedbackBox.className = "mt-4 p-4 w-full max-w-2xl bg-blue-950/80 border border-blue-500 rounded-xl text-center text-lg font-semibold text-blue-300 shadow-lg";

            uploadedVideoElement.onended = () => {
                finalizeLog(modeSelect.options[modeSelect.selectedIndex].text);
            };
        });

        toggleCameraBtn.onclick = () => {
            useFrontCamera = !useFrontCamera;
            startCamera();
        };

        resetLogBtn.addEventListener('click', () => {
            logContent.innerHTML = `<p class="text-slate-500 italic">এখনো কোনো লিফটের ডেটা রেকর্ড করা হয়নি।</p>`;
            detectedIssues = [];
            scanFramesCount = 0;
            repSpeeds = [];
            scanCompleted = false;
        });

        modeSelect.addEventListener('change', () => {
            detectedIssues = [];
            scanFramesCount = 0;
            repSpeeds = [];
            scanCompleted = false;
        });

        startCamera();
    </script>
</body>
</html>
