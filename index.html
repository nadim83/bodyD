<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Powerlifting Form & Session Log</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe Pose JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center p-6">

    <!-- Header & Controls -->
    <header class="text-center mb-4 max-w-2xl w-full">
        <h1 class="text-3xl font-bold text-cyan-400 mb-2">🏋️ AI Powerlifting Form & RPE Logger</h1>
        <p class="text-slate-400 text-sm mb-4">Complete your set, and your final RPE & feedback will be logged below.</p>
        
        <!-- Controls Row -->
        <div class="flex flex-col sm:flex-row gap-3 items-center justify-between">
            <select id="exercise-type" class="w-full sm:flex-1 p-3 bg-slate-800 border border-slate-700 rounded-xl font-semibold text-cyan-300 focus:outline-none focus:border-cyan-400">
                <option value="squat">Squat Analysis</option>
                <option value="bench">Bench Press Analysis</option>
                <option value="deadlift">Deadlift Analysis</option>
            </select>

            <!-- Camera Switch Button -->
            <button id="toggle-camera" class="w-full sm:w-auto px-4 py-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl font-semibold text-cyan-400 transition">
                📷 Switch Camera
            </button>
        </div>
    </header>

    <!-- Main Video & Canvas Container -->
    <div class="relative w-full max-w-2xl bg-slate-800 rounded-2xl overflow-hidden border border-slate-700 shadow-2xl flex justify-center items-center min-h-[360px]">
        <video id="webcam" class="hidden" autoplay playsinline></video>
        <canvas id="output_canvas" class="w-full h-auto block"></canvas>
    </div>

    <!-- Live Status Box -->
    <div id="feedback-box" class="mt-4 p-4 w-full max-w-2xl bg-slate-800 border border-slate-700 rounded-xl text-center text-lg font-semibold text-cyan-300 shadow-lg">
        Get into position and start your set...
    </div>

    <!-- Set Summary & Log Section (যেখানে ফাইনাল রেজাল্ট সেভ হবে) -->
    <div class="mt-6 w-full max-w-2xl bg-slate-800/90 border border-cyan-500/40 rounded-2xl p-5 shadow-2xl">
        <div class="flex justify-between items-center mb-3 border-b border-slate-700 pb-2">
            <h2 class="text-xl font-bold text-cyan-400">📋 Completed Set Summary</h2>
            <button id="reset-log" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-slate-300 transition">Clear Log</button>
        </div>
        <div id="log-content" class="space-y-2 text-slate-300 text-sm">
            <p class="text-slate-500 italic">No sets recorded yet. Finish a rep sequence to log results.</p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-8 text-slate-500 text-xs">
        Powered by MediaPipe Pose & Tailwind CSS
    </footer>

    <!-- App Logic Script -->
    <script type="module">
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const feedbackBox = document.getElementById('feedback-box');
        const exerciseSelect = document.getElementById('exercise-type');
        const toggleCameraBtn = document.getElementById('toggle-camera');
        const logContent = document.getElementById('log-content');
        const resetLogBtn = document.getElementById('reset-log');

        let useFrontCamera = false;
        let currentStream = null;
        
        let lastY = 0;
        let lastTime = Date.now();
        let speedsList = [];
        let formIssues = [];
        let isLiftActive = false;

        function calculateAngle(a, b, c) {
            const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
            let angle = Math.abs(radians * 180.0 / Math.PI);
            if (angle > 180.0) angle = 360 - angle;
            return angle;
        }

        function onResults(results) {
            if (!results.image) return;

            if (canvasElement.width !== videoElement.videoWidth || canvasElement.height !== videoElement.videoHeight) {
                canvasElement.width = videoElement.videoWidth || 640;
                canvasElement.height = videoElement.videoHeight || 480;
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            const selectedExercise = exerciseSelect.value;

            if (results.poseLandmarks) {
                const landmarks = results.poseLandmarks;
                const leftShoulder = landmarks[11];
                const leftHip = landmarks[23];
                const leftKnee = landmarks[25];
                const leftAnkle = landmarks[27];
                const leftElbow = landmarks[13];
                const leftWrist = landmarks[15];

                // Velocity Tracking Calculation
                const currentTime = Date.now();
                const timeDiff = (currentTime - lastTime) / 1000;
                let currentY = leftHip.y;
                if (selectedExercise === 'bench') currentY = leftWrist.y;

                if (timeDiff > 0.05) {
                    const speed = Math.abs(currentY - lastY) / timeDiff;
                    
                    // লিফট শুরু হওয়ার শর্ত (যখন গতি নির্দিষ্ট সীমার বেশি হয়)
                    if (speed > 0.05) {
                        isLiftActive = true;
                        speedsList.push(speed);
                    }

                    // ফর্ম চেক ও ইস্যু রেকর্ড করা
                    if (selectedExercise === 'squat') {
                        drawJointLine(leftShoulder, leftHip, '#06b6d4');
                        drawJointLine(leftHip, leftKnee, '#3b82f6');
                        drawJointLine(leftKnee, leftAnkle, '#3b82f6');
                        const kneeAngle = calculateAngle(leftHip, leftKnee, leftAnkle);
                        
                        if (kneeAngle < 75 && !formIssues.includes("Deep squat depth (Watch lower back wink)")) {
                            formIssues.push("Deep squat depth (Watch lower back wink)");
                        }
                    } else if (selectedExercise === 'bench') {
                        drawJointLine(leftShoulder, leftElbow, '#06b6d4');
                        drawJointLine(leftElbow, leftWrist, '#3b82f6');
                    } else if (selectedExercise === 'deadlift') {
                        drawJointLine(leftShoulder, leftHip, '#06b6d4');
                        drawJointLine(leftHip, leftKnee, '#3b82f6');
                        const torsoLean = Math.abs(leftShoulder.x - leftHip.x);
                        if (torsoLean > 0.28 && !formIssues.includes("Spine rounding / back flexion detected")) {
                            formIssues.push("Spine rounding / back flexion detected");
                        }
                    }

                    // লিফট শেষ হওয়ার লজিক (দীর্ঘক্ষণ মুভমেন্ট না থাকলে বা স্ট্যান্ডিং পজিশনে আসলে সেট শেষ বলে গণ্য হবে)
                    if (isLiftActive && speed < 0.01 && speedsList.length > 10) {
                        finalizeSetAndLog(selectedExercise);
                    }

                    lastY = currentY;
                    lastTime = currentTime;
                }

                feedbackBox.innerText = isLiftActive ? "Lifting in progress... Keep executing! 🔥" : "Ready. Perform your set 🔽";

            } else {
                feedbackBox.innerText = "Step back! Full body not detected in frame ⚠️";
            }
            canvasCtx.restore();
        }

        // সেট শেষ হলে সামারি সেকশনে সেভ করার ফাংশন
        function finalizeSetAndLog(exercise) {
            isLiftActive = false;
            
            // গড় স্পিড থেকে RPE নির্ধারণ
            const avgSpeed = speedsList.reduce((a, b) => a + b, 0) / speedsList.length;
            let finalRPE = "RPE 8.0";
            if (avgSpeed > 0.3) finalRPE = "RPE 6.5 (Fast)";
            else if (avgSpeed > 0.15) finalRPE = "RPE 8.0 (Solid)";
            else if (avgSpeed > 0.05) finalRPE = "RPE 9.0 (Heavy Grind)";
            else finalRPE = "RPE 10 (Max Effort)";

            let problemsHTML = "";
            if (formIssues.length === 0) {
                problemsHTML = `<span class="text-emerald-400 font-semibold">✨ Good Form! No major issues detected.</span>`;
            } else {
                problemsHTML = `<ul class="list-disc list-inside text-rose-400">` + formIssues.map(err => `<li>${err}</li>`).join('') + `</ul>`;
            }

            const timestamp = new Date().toLocaleTimeString();
            
            // লগে যোগ করা
            logContent.innerHTML = `
                <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-700 mb-2">
                    <div class="flex justify-between font-bold text-cyan-300 mb-1">
                        <span>Exercise: ${exercise.toUpperCase()}</span>
                        <span class="text-amber-400">${finalRPE}</span>
                    </div>
                    <div class="text-xs text-slate-400 mb-2">Logged at: ${timestamp}</div>
                    <div>${problemsHTML}</div>
                </div>
            `;

            // ডাটা রিসেট পরবর্তী সেটের জন্য
            speedsList = [];
            formIssues = [];
        }

        resetLogBtn.addEventListener('click', () => {
            logContent.innerHTML = `<p class="text-slate-500 italic">No sets recorded yet. Finish a rep sequence to log results.</p>`;
            speedsList = [];
            formIssues = [];
        });

        function drawJointLine(p1, p2, color) {
            if (!p1 || !p2) return;
            canvasCtx.beginPath();
            canvasCtx.moveTo(p1.x * canvasElement.width, p1.y * canvasElement.height);
            canvasCtx.lineTo(p2.x * canvasElement.width, p2.y * canvasElement.height);
            canvasCtx.lineWidth = 4;
            canvasCtx.strokeStyle = color;
            canvasCtx.stroke();
        }

        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            enableSegmentation: false,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults(onResults);

        async function startCamera() {
            if (currentStream) currentStream.getTracks().forEach(track => track.stop());

            let constraints = {
                video: {
                    facingMode: useFrontCamera ? "user" : { exact: "environment" },
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                }
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
            } catch (err) {
                try {
                    constraints = { video: { width: { ideal: 640 }, height: { ideal: 480 } } };
                    currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (e) {
                    feedbackBox.innerText = "Camera access denied or unavailable.";
                    return;
                }
            }

            videoElement.srcObject = currentStream;
            videoElement.onloadedmetadata = () => {
                videoElement.play().then(() => {
                    async function processVideoFrame() {
                        if (!videoElement.paused && !videoElement.ended) {
                            await pose.send({ image: videoElement });
                            requestAnimationFrame(processVideoFrame);
                        }
                    }
                    processVideoFrame();
                });
            };
        }

        toggleCameraBtn.addEventListener('click', () => {
            useFrontCamera = !useFrontCamera;
            startCamera();
        });

        startCamera();
    </script>
</body>
</html>
