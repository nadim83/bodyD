<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Powerlifting Form & Accurate RPE Analyzer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe Pose JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center p-6">

    <!-- Header & Controls -->
    <header class="text-center mb-4 max-w-2xl w-full">
        <h1 class="text-3xl font-bold text-cyan-400 mb-2">🏋️ AI Powerlifting Accurate RPE Analyzer</h1>
        <p class="text-slate-400 text-sm mb-4">Concentric phase tracking for precise RPE and form feedback.</p>
        
        <!-- Controls Row -->
        <div class="flex flex-col sm:flex-row gap-3 items-center justify-between">
            <select id="exercise-type" class="w-full sm:flex-1 p-3 bg-slate-800 border border-slate-700 rounded-xl font-semibold text-cyan-300 focus:outline-none focus:border-cyan-400">
                <option value="squat">Squat Analysis</option>
                <option value="bench">Bench Press Analysis</option>
                <option value="deadlift">Deadlift Analysis</option>
            </select>

            <!-- Camera Switch Button -->
            <button id="toggle-camera" class="w-full sm:w-auto px-4 py-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl font-semibold text-cyan-400 transition">
                📷 Switch Camera
            </button>
        </div>

        <!-- Video Upload Section -->
        <div class="mt-4 p-4 bg-slate-800 border border-dashed border-slate-600 rounded-xl text-center">
            <label class="block text-sm font-medium text-slate-300 mb-2">📁 Upload Lift Video - Auto Concentric RPE Calculation</label>
            <input type="file" id="video-upload" accept="video/*" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-cyan-600 file:text-white hover:file:bg-cyan-500 cursor-pointer">
        </div>
    </header>

    <!-- Main Video/Upload & Canvas Container -->
    <div class="relative w-full max-w-2xl bg-slate-800 rounded-2xl overflow-hidden border border-slate-700 shadow-2xl flex justify-center items-center min-h-[360px]">
        <video id="webcam" class="hidden" autoplay playsinline muted></video>
        <video id="uploaded-video" class="w-full h-auto block" controls playsinline muted></video>
        <canvas id="output_canvas" class="absolute inset-0 w-full h-full pointer-events-none"></canvas>
    </div>

    <!-- Live Status Box -->
    <div id="feedback-box" class="mt-4 p-4 w-full max-w-2xl bg-slate-800 border border-slate-700 rounded-xl text-center text-lg font-semibold text-cyan-300 shadow-lg">
        Position yourself clearly in front of the laptop camera... ⏳
    </div>

    <!-- Set Summary & Log Section -->
    <div class="mt-6 w-full max-w-2xl bg-slate-800/90 border border-cyan-500/40 rounded-2xl p-5 shadow-2xl">
        <div class="flex justify-between items-center mb-3 border-b border-slate-700 pb-2">
            <h2 class="text-xl font-bold text-cyan-400">📋 Accurate RPE & Form Breakdown</h2>
            <button id="reset-log" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-slate-300 transition">Clear Log</button>
        </div>
        <div id="log-content" class="space-y-2 text-slate-300 text-sm">
            <p class="text-slate-500 italic">No lift analyzed yet.</p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-8 text-slate-500 text-xs">
        Powered by MediaPipe Pose & Powerlifting Biomechanics
    </footer>

    <!-- App Logic Script -->
    <script type="module">
        const webcamElement = document.getElementById('webcam');
        const uploadedVideoElement = document.getElementById('uploaded-video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const feedbackBox = document.getElementById('feedback-box');
        const exerciseSelect = document.getElementById('exercise-type');
        const toggleCameraBtn = document.getElementById('toggle-camera');
        const videoUploadInput = document.getElementById('video-upload');
        const logContent = document.getElementById('log-content');
        const resetLogBtn = document.getElementById('reset-log');

        let useFrontCamera = false;
        let currentStream = null;
        let activeSource = webcamElement;

        let lastY = 0;
        let lastTime = Date.now();
        let concentricVelocities = [];
        let formIssues = [];
        let isProcessing = false;
        let isSending = false;
        let liveStationaryCount = 0;

        function calculateAngle(a, b, c) {
            const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
            let angle = Math.abs(radians * 180.0 / Math.PI);
            if (angle > 180.0) angle = 360 - angle;
            return angle;
        }

        function onResults(results) {
            if (!results.image) return;

            if (canvasElement.width !== activeSource.videoWidth || canvasElement.height !== activeSource.videoHeight) {
                canvasElement.width = activeSource.videoWidth || 640;
                canvasElement.height = activeSource.videoHeight || 480;
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            if (activeSource === webcamElement) {
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            }

            const selectedExercise = exerciseSelect.value;

            if (results.poseLandmarks) {
                const landmarks = results.poseLandmarks;
                const leftShoulder = landmarks[11];
                const leftHip = landmarks[23];
                const leftKnee = landmarks[25];
                const leftAnkle = landmarks[27];
                const leftElbow = landmarks[13];
                const leftWrist = landmarks[15];

                let currentY = leftHip.y;
                if (selectedExercise === 'bench') currentY = leftWrist.y;

                const currentTime = Date.now();
                const timeDiff = (currentTime - lastTime) / 1000;

                if (timeDiff > 0.015) {
                    const deltaY = currentY - lastY; 
                    const velocity = Math.abs(deltaY) / timeDiff;

                    // ল্যাপটপ ক্যামেরার সেন্সিভিটি একটু বাড়িয়ে দেওয়া হলো যাতে হালকা মুভমেন্টও ট্র্যাক করতে পারে
                    if (deltaY < -0.002) { 
                        isProcessing = true;
                        liveStationaryCount = 0;
                        concentricVelocities.push(velocity);
                    } else if (isProcessing && velocity < 0.015) {
                        liveStationaryCount++;
                        // লাইভ ক্যামেরার ক্ষেত্রে সেট শেষ করে স্থির হলে দ্রুত RPE দেখাবে
                        if (activeSource === webcamElement && liveStationaryCount > 30 && concentricVelocities.length > 5) {
                            finalizeSetAndLog(selectedExercise);
                        }
                    }

                    if (isProcessing) {
                        if (selectedExercise === 'squat') {
                            drawJointLine(leftShoulder, leftHip, '#06b6d4');
                            drawJointLine(leftHip, leftKnee, '#3b82f6');
                            drawJointLine(leftKnee, leftAnkle, '#3b82f6');
                            const kneeAngle = calculateAngle(leftHip, leftKnee, leftAnkle);
                            
                            if (kneeAngle < 85) {
                                if(!formIssues.includes("✓ Proper Squat Depth Achieved")) formIssues.push("✓ Proper Squat Depth Achieved");
                            } else {
                                if(!formIssues.includes("⚠️ High Squat (Insufficient Depth)")) formIssues.push("⚠️ High Squat (Insufficient Depth)");
                            }
                        } else if (selectedExercise === 'bench') {
                            drawJointLine(leftShoulder, leftElbow, '#06b6d4');
                            drawJointLine(leftElbow, leftWrist, '#3b82f6');
                            const elbowAngle = calculateAngle(leftShoulder, leftElbow, leftWrist);
                            if (elbowAngle < 75) {
                                if(!formIssues.includes("✓ Solid Touch on Chest")) formIssues.push("✓ Solid Touch on Chest");
                            }
                        } else if (selectedExercise === 'deadlift') {
                            drawJointLine(leftShoulder, leftHip, '#06b6d4');
                            drawJointLine(leftHip, leftKnee, '#3b82f6');
                            const spineLean = Math.abs(leftShoulder.x - leftHip.x);
                            if (spineLean > 0.32) {
                                if(!formIssues.includes("⚠️ Lower Back Rounding Detected")) formIssues.push("⚠️ Lower Back Rounding Detected");
                            } else {
                                if(!formIssues.includes("✓ Neutral Spine Maintained")) formIssues.push("✓ Neutral Spine Maintained");
                            }
                        }
                    }

                    lastY = currentY;
                    lastTime = currentTime;
                }

                if (!isProcessing && activeSource === webcamElement) {
                    feedbackBox.innerText = "Camera Active. Perform your " + selectedExercise.toUpperCase() + " set 🔽";
                    feedbackBox.className = "mt-4 p-4 w-full max-w-2xl bg-slate-800 border border-slate-700 rounded-xl text-center text-lg font-semibold text-cyan-300 shadow-lg";
                }

            } else {
                if (!isProcessing && activeSource === webcamElement) {
                    feedbackBox.innerText = "Step back so your full body is visible in the camera ⚠️";
                    feedbackBox.className = "mt-4 p-4 w-full max-w-2xl bg-amber-950/80 border border-amber-500 rounded-xl text-center text-lg font-semibold text-amber-400 shadow-lg";
                }
            }
            canvasCtx.restore();
        }

        function finalizeSetAndLog(exercise) {
            if (concentricVelocities.length === 0) return;

            isProcessing = false;
            liveStationaryCount = 0;
            
            const avgVel = concentricVelocities.reduce((a, b) => a + b, 0) / concentricVelocities.length;

            let finalRPE = "RPE 8.0";
            let rpeColor = "text-amber-400";

            if (avgVel > 0.45) {
                finalRPE = "RPE 6.0 - 6.5 (Very Fast / Warm-up)";
                rpeColor = "text-emerald-400";
            } else if (avgVel > 0.30) {
                finalRPE = "RPE 7.0 - 7.5 (Moderate Speed / Working Weight)";
                rpeColor = "text-teal-400";
            } else if (avgVel > 0.18) {
                finalRPE = "RPE 8.0 - 8.5 (Heavy Set / Solid Effort)";
                rpeColor = "text-cyan-400";
            } else if (avgVel > 0.09) {
                finalRPE = "RPE 9.0 - 9.5 (Heavy Grind / Submaximal)";
                rpeColor = "text-amber-400";
            } else {
                finalRPE = "RPE 10 (Max Effort / Ultimate Grinder)";
                rpeColor = "text-rose-500 font-bold";
            }

            let uniqueIssues = [...new Set(formIssues)];
            let problemsHTML = "";
            
            if (uniqueIssues.length === 0) {
                problemsHTML = `<span class="text-emerald-400 font-semibold text-base">✨ Clean Form & Execution!</span>`;
            } else {
                problemsHTML = `<ul class="space-y-1">` + uniqueIssues.map(err => {
                    let colorClass = err.startsWith('✓') ? 'text-emerald-400' : 'text-rose-400';
                    return `<li class="${colorClass} text-sm">${err}</li>`;
                }).join('') + `</ul>`;
            }

            const timestamp = new Date().toLocaleTimeString();
            
            logContent.innerHTML = `
                <div class="bg-slate-900/90 p-4 rounded-xl border border-slate-700 mb-2 shadow-inner">
                    <div class="flex justify-between font-bold text-cyan-300 text-base mb-1">
                        <span>Exercise: ${exercise.toUpperCase()}</span>
                        <span class="${rpeColor}">${finalRPE}</span>
                    </div>
                    <div class="text-xs text-slate-400 mb-3">Concentric Velocity Score: ${avgVel.toFixed(3)} | Analyzed at: ${timestamp}</div>
                    <div class="bg-slate-800/80 p-3 rounded-lg border border-slate-700">${problemsHTML}</div>
                </div>
            `;
            
            feedbackBox.innerText = "Live Set RPE Analyzed Successfully! 🎯";
            feedbackBox.className = "mt-4 p-4 w-full max-w-2xl bg-emerald-950/80 border border-emerald-500 rounded-xl text-center text-lg font-semibold text-emerald-300 shadow-lg";
            
            concentricVelocities = [];
            formIssues = [];
        }

        function drawJointLine(p1, p2, color) {
            if (!p1 || !p2) return;
            canvasCtx.beginPath();
            canvasCtx.moveTo(p1.x * canvasElement.width, p1.y * canvasElement.height);
            canvasCtx.lineTo(p2.x * canvasElement.width, p2.y * canvasElement.height);
            canvasCtx.lineWidth = 4;
            canvasCtx.strokeStyle = color;
            canvasCtx.stroke();
        }

        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            enableSegmentation: false,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults(onResults);

        async function runAnalyzerLoop() {
            if (!activeSource.paused && !activeSource.ended) {
                if (!isSending && activeSource.readyState >= 2) {
                    isSending = true;
                    try {
                        await pose.send({ image: activeSource });
                    } catch (err) {
                        console.error("Pose send error:", err);
                    }
                    isSending = false;
                }
                requestAnimationFrame(runAnalyzerLoop);
            }
        }

        async function startCamera() {
            if (currentStream) currentStream.getTracks().forEach(track => track.stop());
            uploadedVideoElement.classList.add('hidden');
            webcamElement.classList.remove('hidden');
            
            activeSource = webcamElement;
            isProcessing = false;
            concentricVelocities = [];
            formIssues = [];
            liveStationaryCount = 0;

            let constraints = {
                video: {
                    facingMode: useFrontCamera ? "user" : "environment",
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                }
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
            } catch (err) {
                try {
                    constraints = { video: { width: { ideal: 640 }, height: { ideal: 480 } } };
                    currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (e) {
                    feedbackBox.innerText = "Camera access denied or unavailable.";
                    return;
                }
            }

            webcamElement.srcObject = currentStream;
            webcamElement.onloadedmetadata = () => {
                webcamElement.play().then(() => {
                    runAnalyzerLoop();
                });
            };
        }

        videoUploadInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const videoUrl = URL.createObjectURL.createObjectURL ? URL.createObjectURL(file) : URL.createObjectURL(file);
            
            webcamElement.classList.add('hidden');
            uploadedVideoElement.classList.remove('hidden');

            uploadedVideoElement.src = videoUrl;
            uploadedVideoElement.load();
            
            activeSource = uploadedVideoElement;
            isProcessing = true;
            concentricVelocities = [];
            formIssues = [];

            uploadedVideoElement.play().then(() => {
                runAnalyzerLoop();
            }).catch(e => {
                console.error("Autoplay prevented:", e);
                feedbackBox.innerText = "Click play on the video to start analysis ⚠️";
            });
            
            feedbackBox.innerText = "Analyzing uploaded video... 🎬";
            feedbackBox.className = "mt-4 p-4 w-full max-w-2xl bg-blue-950/80 border border-blue-500 rounded-xl text-center text-lg font-semibold text-blue-300 shadow-lg";

            uploadedVideoElement.onended = () => {
                const selectedExercise = exerciseSelect.value;
                finalizeSetAndLog(selectedExercise);
            };
        });

        toggleCameraBtn.onclick = () => {
            useFrontCamera = !useFrontCamera;
            startCamera();
        };

        resetLogBtn.addEventListener('click', () => {
            logContent.innerHTML = `<p class="text-slate-500 italic">No lift analyzed yet.</p>`;
            concentricVelocities = [];
            formIssues = [];
            isProcessing = false;
            liveStationaryCount = 0;
        });

        startCamera();
    </script>
</body>
</html>
